server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html/metrics;
    index index.html;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    # Cache static assets (CSS/JS/images inside generated reports)
    location ~* \.(css|js|png|jpg|gif|ico|svg|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public, immutable";
    }
}
