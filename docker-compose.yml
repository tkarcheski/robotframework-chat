# Production Docker Compose for robotframework-chat + Superset
#
# Quick start:
#   cp .env.example .env        # edit credentials
#   make docker-up               # start the stack
#   make bootstrap              # first-time Superset setup
#   open http://localhost:8088   # Superset analytics
#   open http://localhost:8089   # RF Metrics dashboard
#
# Run tests with archiving to PostgreSQL:
#   make robot-math
#
# See Makefile for all available targets.

services:
  # ── Application (test runner + dev tools) ────────────────────────────
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rfc}:${POSTGRES_PASSWORD:-changeme}@postgres:${POSTGRES_INTERNAL_PORT:-5432}/${POSTGRES_DB:-rfc}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./results:/app/results
    networks:
      - rfc-net
    stdin_open: true
    tty: true

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rfc}
    ports:
      - "${POSTGRES_PORT:-5433}:${POSTGRES_INTERNAL_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rfc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rfc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis (Superset cache + answer cache) ───────────────────────────
  # Superset uses db 0 (cache) and db 2 (ratelimit), both in-network. The
  # answer cache (db 1) is reached from host-side `robot` runs, so Redis must
  # publish a host port — otherwise REDIS_URL=redis://localhost:6379/1 is
  # unreachable and the cache silently latches to passthrough. Bound to
  # 127.0.0.1 only: redis:7-alpine has no auth, so it must never be exposed
  # off-host.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - rfc-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Superset init (one-shot: migrate, create admin, bootstrap) ──────
  superset-init:
    build: ./superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-generate-a-random-secret-here}
      POSTGRES_USER: ${POSTGRES_USER:-rfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rfc}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@rfc.local}
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - ./superset/bootstrap_dashboards.py:/app/bootstrap_dashboards.py:ro
    networks:
      - rfc-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin \
          --username "$SUPERSET_ADMIN_USER" \
          --firstname Admin \
          --lastname User \
          --email "$SUPERSET_ADMIN_EMAIL" \
          --password "$SUPERSET_ADMIN_PASSWORD" || true &&
        superset init &&
        (python /app/bootstrap_dashboards.py ||
          echo "WARNING: dashboard bootstrap failed (non-fatal)") &&
        echo "=== Superset init complete ==="
    restart: "no"

  # ── Superset web server ─────────────────────────────────────────────
  superset:
    build: ./superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-generate-a-random-secret-here}
      POSTGRES_USER: ${POSTGRES_USER:-rfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-rfc}
      POSTGRES_INTERNAL_PORT: ${POSTGRES_INTERNAL_PORT:-5432}
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
    networks:
      - rfc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── RF Metrics (HTML dashboard from output.xml) ─────────────────────
  metrics:
    build: ./metrics
    restart: unless-stopped
    environment:
      METRICS_REFRESH_INTERVAL: ${METRICS_REFRESH_INTERVAL:-300}
    volumes:
      - ./results:/app/results:ro
    ports:
      - "${METRICS_PORT:-8089}:80"
    networks:
      - rfc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  rfc-net:
    driver: bridge

volumes:
  pgdata:
