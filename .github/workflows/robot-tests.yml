name: Robot Framework Tests

on:
  push:
    branches: [main, claude-code-staging]
  pull_request:
    branches: [main, claude-code-staging]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --extra superset --extra swebench

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Pre-commit (all hooks, all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing

  agent-git-contract:
    name: Agent Git Contract Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against the merge-base with the target branch,
          # so it needs real history, not a depth-1 snapshot.
          fetch-depth: 0

      # The submodule pointer-bump guard was retired from the public surface
      # (public #554): this repo has no .gitmodules, so there was nothing for
      # check_submodule_ownership.py to check. The monorepo keeps its own copy
      # of the guard; submodule ownership there is process-enforced (GIT.md).
      - name: Check agent commit sign-offs and Model trailers
        run: |
          git fetch origin "${{ github.base_ref }}"
          python3 scripts/check_agent_signoffs.py --base "origin/${{ github.base_ref }}"

  robot-dryrun:
    name: Robot Suite Validation (dry-run)
    runs-on: ubuntu-latest
    env:
      # Keyword libraries validate DEFAULT_MODEL at init; a dry run parses
      # but never calls the model, so a placeholder satisfies them.
      DEFAULT_MODEL: dryrun-placeholder
      OLLAMA_ENDPOINT: http://localhost:11434
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Same as `make install`: keyword libraries import superset/swebench
        # deps at parse time, so dev-only installs fail the dry-run en masse.
        run: uv sync --extra dev --extra superset --extra swebench

      - name: Validate robot files (dry-run)
        run: uv run robot --dryrun --exclude browser -d results/dryrun --listener rfc.dry_run_listener.DryRunListener robot/

      - name: Check tag compliance (advisory)
        # TEMPORARILY non-blocking: the gate never ran on staging before, and
        # 115 pre-existing tests are missing tier:*/verify:* tags (tracked in
        # a dedicated issue). Flip to blocking once the backlog is tagged.
        continue-on-error: true
        run: uv run python scripts/robot_review.py results/dryrun/output.xml

      - name: Upload dry-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-results
          path: results/dryrun/

  robot-tests:
    name: Robot Tests
    runs-on: self-hosted
    needs: [lint, robot-dryrun]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      LISTENERS: >-
        --listener rfc.db_listener.DbListener
        --listener rfc.git_metadata_listener.GitMetaData
        --listener rfc.ollama_timestamp_listener.OllamaTimestampListener
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --extra superset --extra swebench

      - name: Run math tests
        run: uv run robot -d results/math $LISTENERS robot/20__tier2/math/

      - name: Run safety tests
        if: always()
        run: uv run robot -d results/safety $LISTENERS robot/20__tier2/safety/

      - name: Run Docker tests
        if: always()
        run: uv run robot -d results/docker $LISTENERS robot/40__tier4/docker/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
