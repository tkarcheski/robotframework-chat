# .gitlab-ci.yml - Bare-bones pipeline skeleton
#
# All logic lives in ci/*.sh scripts and Makefile targets.
# This file is intentionally minimal. To modify pipeline behavior,
# edit the scripts -- not this file.
#
# Pipeline modes:
#   1. Test     - every push/MR, per-node `make run-local-models` (allow_failure)
#   2. Release  - clean semver tag (v1.2.3), build + publish to PyPI
#   3. Test Release - pre-release tag (v1.2.3-rc1), build + verify only
#
# Nodes: ai1, mini1, mini2, dev1, dev2 (matched by GitLab runner tags)
#
# See: ai/PIPELINES.md

include:
  - local: ci/common.yml

stages:
  - lint
  - test
  - report
  - deploy
  - release
  - review

variables:
  OLLAMA_ENDPOINT: "http://localhost:11434"
  DEFAULT_MODEL: "llama3"
  ROBOT_OPTIONS: "--metadata CI:true"

# ── Lint ─────────────────────────────────────────────────────────────

lint:
  extends: .uv-setup
  stage: lint
  script: [bash ci/lint.sh all]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH

# ── Test: Per-Node Model Runs ──────────────────────────────────────

.run-local-models:
  extends: .robot-test
  stage: test
  needs:
    - job: lint
      artifacts: false
  script: [make run-local-models]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

run-local-models-ai1:
  extends: .run-local-models
  tags: [ai1]

run-local-models-mini1:
  extends: .run-local-models
  tags: [mini1]

run-local-models-mini2:
  extends: .run-local-models
  tags: [mini2]

run-local-models-dev1:
  extends: .run-local-models
  tags: [dev1]

run-local-models-dev2:
  extends: .run-local-models
  tags: [dev2]

# ── Report ───────────────────────────────────────────────────────────

repo-metrics:
  extends: .uv-setup
  stage: report
  needs: []
  script: [make ci-report POST_MR=1]
  artifacts:
    paths: [metrics/]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pipeline-summary:
  extends: .uv-setup
  stage: report
  needs:
    - job: lint
      artifacts: false
      optional: true
  script: [bash ci/pipeline_report.sh --post-mr]
  artifacts:
    paths: [metrics/]
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Deploy ───────────────────────────────────────────────────────────

deploy-superset:
  stage: deploy
  tags: [deploy]
  script: [make ci-deploy]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SUPERSET_DEPLOY_HOST

# ── Release ──────────────────────────────────────────────────────────

# Test release: any semver tag with a pre-release suffix (v1.2.3-*)
# Builds and verifies the package but does NOT upload to PyPI.
test-release:
  extends: .uv-setup
  stage: release
  needs:
    - job: lint
      artifacts: false
  script: [make ci-release]
  artifacts:
    paths: [dist/]
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-.+/
  allow_failure: false

# Real release: clean semver tag only (v1.2.3)
# Builds, verifies, and uploads to PyPI.
publish-pypi:
  extends: .uv-setup
  stage: release
  needs:
    - job: lint
      artifacts: false
  script: [make ci-release UPLOAD=1]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  allow_failure: false

# ── Review ───────────────────────────────────────────────────────────

opencode-review:
  stage: review
  tags: [nodejs]
  variables:
    REVIEW_MODEL: "openrouter/moonshotai/kimi-k2.5"
  before_script:
    - npm install -g opencode-ai
  script: [make opencode-pipeline-review]
  artifacts:
    paths:
      - review-result.md
      - review-fix-attempt.md
      - review-patch-*.diff
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /opencode-review/
    - when: manual
