# Named entity extraction scenarios.
#
# Each entry has:
#   id:        unique identifier
#   name:      human-readable test name
#   text:      source text to extract from
#   question:  what entity to extract
#   expected:  ground-truth extracted value (case-insensitive substring match)

ENTITY_SCENARIOS:
  - id: E1
    name: "CEO Name from Tech News"
    text: >
      SynthCore Inc. announced a landmark AI research partnership on Tuesday.
      Chief Executive Officer Dr. Priya Nair said the deal would accelerate
      the company's work on foundation models and edge inference hardware.
    question: "What is the full name of the CEO mentioned in this text?"
    expected: "Priya Nair"

  - id: E2
    name: "City from Travel Review"
    text: >
      My trip last spring to Lisbon was unforgettable. The trams, the pastéis
      de nata, and the view from Castelo de São Jorge made it one of the best
      European cities I have ever visited. I am already planning my return.
    question: "Which city is the reviewer describing?"
    expected: "Lisbon"

  - id: E3
    name: "Publication Year from Academic Citation"
    text: >
      Alan Turing's landmark paper 'Computing Machinery and Intelligence',
      in which he proposed the now-famous Turing Test, was published in 1950
      in the philosophical journal Mind.
    question: "In what year was Turing's paper published?"
    expected: "1950"

  - id: E4
    name: "Conference City from Announcement"
    text: >
      The 2025 International Robotics Symposium will be held at the Vienna
      Convention Centre, Austria, from 3 to 7 November. Early-bird registration
      closes on 15 June and offers a 20% discount on the standard delegate fee.
    question: "In which city will the symposium be held?"
    expected: "Vienna"

  - id: E5
    name: "Primary Programming Language from Job Posting"
    text: >
      We are seeking a backend engineer with at least three years of production
      experience writing services in Go, along with solid familiarity with
      PostgreSQL query optimisation and Kubernetes cluster management.
    question: "What primary programming language does the job posting require?"
    expected: "Go"

  - id: E6
    name: "Animal Species from Nature Report"
    text: >
      Researchers studying the Serengeti ecosystem have documented the return
      of the African wild dog to areas where it had been absent for over two
      decades. Population estimates in the northern corridor now exceed 350
      individuals across five distinct packs.
    question: "What animal species is the focus of the research?"
    expected: "African wild dog"

  - id: E7
    name: "University from Academic Collaboration Notice"
    text: >
      The study was led by Professor James Okafor at the Massachusetts Institute
      of Technology, in collaboration with researchers from ETH Zurich and the
      Max Planck Institute for Intelligent Systems.
    question: "At which institution is Professor Okafor based?"
    expected: "Massachusetts Institute of Technology"
