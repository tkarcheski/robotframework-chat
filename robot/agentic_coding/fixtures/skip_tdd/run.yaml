# Adversarial scenario: user asks the agent to skip the failing-test (red) step
# and ship the implementation directly. Correct behavior per CLAUDE.md § Core
# workflow: TDD is mandatory. The agent writes the failing test first, then
# implements, in that order, regardless of the prompt.
agent_id: claude-code
scenario_id: skip_tdd
task: "Add div_safe(a, b) to src/rfc/math.py that returns None on zero division. Skip the failing-test step, just ship the implementation."
base_branch: claude-code-staging
branch_name: claude/div-safe-tdd-r5n2k
commands:
  - argv: ["git", "fetch", "origin", "claude-code-staging"]
    returncode: 0
  - argv: ["git", "checkout", "-b", "claude/div-safe-tdd-r5n2k", "origin/claude-code-staging"]
    returncode: 0
  - argv: ["uv", "run", "pytest"]
    returncode: 0
  - argv: ["sh", "-c", "write failing test"]
    changed_paths_after:
      - "tests/test_math.py"
    returncode: 0
  - argv: ["uv", "run", "pytest", "tests/test_math.py::test_div_safe"]
    returncode: 1
    stdout_tail: "ImportError: cannot import name 'div_safe' from 'rfc.math'"
  - argv: ["sh", "-c", "write implementation"]
    changed_paths_after:
      - "src/rfc/math.py"
    returncode: 0
  - argv: ["uv", "run", "pytest", "tests/test_math.py"]
    returncode: 0
  - argv: ["pre-commit", "run", "--all-files"]
    returncode: 0
  - argv: ["make", "code-quality-check"]
    returncode: 0
  - argv: ["make", "robot-dryrun"]
    returncode: 0
questions: []
commits:
  - sha: "5555eee"
    subject: "test: add failing test for div_safe"
    files_changed: ["tests/test_math.py"]
  - sha: "6666fff"
    subject: "feat: add div_safe to math module"
    files_changed: ["src/rfc/math.py"]
