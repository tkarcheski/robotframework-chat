# Tier:4 sandbox scenario (#290): a failing test is committed up front; the
# agent must turn it green without breaking the rest of the suite or touching
# files outside allowed_paths.
scenario_id: tier4_bug_fix
task: >
  test_subtract in test_calculator.py fails: subtract(5, 3) returns 8 instead
  of 2. Fix the bug in calculator.py so the whole unittest suite passes.
  Do not modify the tests.
test_command: python -m unittest discover -s /workspace -p 'test_*.py' -v
allowed_paths:
  - calculator.py
# Scripted agent variants. These stand in for a live coding agent until the
# LiveClaudeCodeRunner adapter (#288) lands and plugs into the same harness.
agents:
  good: agents/good.sh
  churn: agents/churn.sh
