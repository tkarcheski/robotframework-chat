# Seeded inputs for CEO agent vending machine scenario
#
# Simulates the full CEO pipeline for next-generation vending machine
# innovations — from brainstorming through licensing.

# Stage 1: Brainstorming
VENDING_BRAINSTORM_SEED:
  domain: "smart vending machines and automated retail"
  count: 3
  constraints: "Focus on AI-powered personalization, contactless interaction, and sustainable packaging"

# Stage 2: Market Research — seeded ideas (brainstorm output)
VENDING_MARKET_RESEARCH_SEED:
  ideas:
    - name: "NutriVend AI Dietary Advisor"
      description: "Smart vending machine that scans a customer's loyalty profile and health preferences to recommend snacks and meals aligned with their dietary goals, allergies, and macros. Uses on-device ML to personalize in real time."
      category: "automated_retail"
      novelty_notes: "First vending platform to combine real-time dietary profiling with inventory-aware recommendations — existing machines only offer static catalogs."
    - name: "BrewBot Micro-Roastery"
      description: "Automated vending kiosk that roasts, grinds, and brews single-origin coffee beans on demand. Customers select roast level, grind size, and brew method via touchscreen. Green beans are stored in nitrogen-flushed hoppers."
      category: "food_and_beverage"
      novelty_notes: "No existing vending machine performs on-site roasting. Current automated coffee machines use pre-roasted beans, losing freshness and customization."
    - name: "PackBack Reverse Vending System"
      description: "Vending machine network that accepts returned packaging (cups, containers, bottles) via computer vision sorting, credits the customer's account, and compacts waste for efficient recycling pickup. Integrates with municipal waste APIs."
      category: "sustainability"
      novelty_notes: "Combines deposit-return with AI-based material classification and municipal logistics API integration — existing reverse vending handles only standardized bottles."

# Pre-populated web cache for market research
VENDING_MARKET_WEB_CACHE:
  "smart vending machine market size 2025":
    - title: "Smart Vending Machine Market Outlook 2024-2030"
      url: "https://example.com/vending-market-report"
      snippet: "The global smart vending machine market was valued at $11.2B in 2024, projected to reach $25.3B by 2030 at a CAGR of 14.6%. Growth driven by AI personalization and contactless payments."
  "automated coffee kiosk market competitors":
    - title: "Automated Coffee Retail Competitive Landscape"
      url: "https://example.com/coffee-kiosk-report"
      snippet: "Key players include Briggo, Cafe X, and Costa Express. Fully automated coffee kiosks represent $2.8B of the broader $430B coffee market. No major player offers on-site roasting."
  "reverse vending machine recycling market":
    - title: "Reverse Vending and Container Deposit Systems"
      url: "https://example.com/reverse-vending-report"
      snippet: "TOMRA dominates with 80,000+ installations. Global reverse vending market valued at $580M in 2024. Computer vision sorting is an emerging differentiator."

# Stage 3: IP Analysis — seeded market analyses
VENDING_IP_ANALYSIS_SEED:
  analyses:
