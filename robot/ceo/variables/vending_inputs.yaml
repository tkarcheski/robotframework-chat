      demand_score: 0.79
      market_size: "$25.3B smart vending by 2030"
      competitors:
        - "Farmer's Fridge"
        - "Byte Foods"
        - "Yo-Kai Express"
      profitability: "high"
    - idea_name: "BrewBot Micro-Roastery"
