      market_size: "$2.8B automated coffee kiosks"
      competitors:
        - "Briggo"
        - "Cafe X"
        - "Costa Express"
      profitability: "high"
    - idea_name: "PackBack Reverse Vending System"
      demand_score: 0.68
      market_size: "$580M reverse vending"
      competitors:
        - "TOMRA"
        - "Envipco"
        - "Diebold Nixdorf"
      profitability: "medium"

# Pre-populated web cache for IP analysis
VENDING_IP_WEB_CACHE:
  "vending machine dietary recommendation patent":
    - title: "US Patent 11,123,456 - Automated Food Dispensing with Dietary Matching"
      url: "https://patents.google.com/patent/US11123456"
      snippet: "System for dispensing food items matching stored dietary profiles. Uses cloud-based matching only, not on-device ML. Does not perform real-time personalization from sensor data."
  "automated coffee roasting vending patent":
    - title: "US Patent 10,987,654 - Automated Coffee Brewing Apparatus"
      url: "https://patents.google.com/patent/US10987654"
      snippet: "Automated brewing system with grind selection. Does not include on-site roasting or nitrogen-flushed green bean storage. Limited to pre-roasted bean dispensing."
  "reverse vending computer vision sorting patent":
    - title: "EP Patent 3,456,789 - Container Recognition for Reverse Vending"
      url: "https://patents.google.com/patent/EP3456789"
      snippet: "Optical recognition for standardized bottle shapes. Does not handle arbitrary packaging types or integrate with municipal waste logistics APIs."

# Stage 4: Patent Strategy — seeded IP findings
VENDING_PATENT_STRATEGY_SEED:
  findings:
    - idea_name: "NutriVend AI Dietary Advisor"
      patentability_score: 0.76
      prior_art_gaps:
        - "On-device ML for real-time dietary personalization at point of vend"
        - "Inventory-aware recommendation engine that factors expiration dates and stock levels"
      claim_angles:
        - "Method for real-time dietary recommendation at an automated retail terminal using on-device inference"
        - "System combining inventory state with health profile data for personalized product selection"
    - idea_name: "BrewBot Micro-Roastery"
      patentability_score: 0.89
      prior_art_gaps:
        - "Integrated roasting-grinding-brewing pipeline in a vending form factor"
        - "Nitrogen-flushed green bean storage with automated roast profiling"
      claim_angles:
        - "Apparatus for on-demand coffee roasting, grinding, and brewing within a self-service kiosk"
        - "Method for preserving green coffee beans in nitrogen atmosphere with per-order roast curve selection"
    - idea_name: "PackBack Reverse Vending System"
      patentability_score: 0.72
      prior_art_gaps:
        - "Multi-material computer vision classification beyond standardized containers"
        - "Integration of reverse vending with municipal waste logistics scheduling"
      claim_angles:
        - "Method for classifying arbitrary packaging materials using computer vision in a reverse vending machine"
        - "System for coordinating reverse vending collection with municipal recycling pickup via API"

# Stage 5: Licensing Strategy — seeded patent strategies
VENDING_LICENSING_STRATEGY_SEED:
  strategies:
    - idea_name: "NutriVend AI Dietary Advisor"
      claim_type: "utility"
      abstract: "A system and method for personalized dietary recommendation at automated retail terminals, comprising on-device machine learning inference from customer health profiles, real-time inventory state awareness, and freshness-optimized product selection."
      key_claims:
        - "A method for generating personalized food recommendations at a vending terminal comprising receiving a dietary profile, querying inventory state including expiration data, and executing on-device ML inference to rank available products"
        - "A vending system with integrated health profile reader and on-device neural network for real-time dietary matching"
      filing_priority: "high"
    - idea_name: "BrewBot Micro-Roastery"
      claim_type: "utility"
      abstract: "An automated kiosk apparatus for on-demand coffee roasting, grinding, and brewing, comprising nitrogen-flushed green bean storage, programmable roast profiling with real-time temperature control, and customer-selectable grind and brew parameters."
      key_claims:
        - "An apparatus comprising a roasting chamber, nitrogen storage vessel, and automated grind-and-brew assembly integrated within a self-service kiosk form factor"
        - "A method for on-demand single-origin coffee preparation comprising selecting a roast profile, roasting green beans, grinding to a specified particle size, and brewing via a customer-selected method"
      filing_priority: "critical"
    - idea_name: "PackBack Reverse Vending System"
      claim_type: "provisional"
      abstract: "A reverse vending system for accepting and classifying arbitrary packaging materials using computer vision, crediting customer accounts, compacting sorted waste, and scheduling municipal recycling pickup via logistics API integration."
      key_claims:
        - "A method for reverse vending comprising receiving packaging, classifying material type via computer vision, sorting into material-specific compaction chambers, and transmitting pickup requests to a municipal logistics API"
      filing_priority: "medium"
