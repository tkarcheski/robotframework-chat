# Security vulnerability detection scenarios — multiple-choice format (A–D).
#
# Each entry has:
#   id:              unique identifier
#   name:            human-readable test name
#   code:            code snippet containing a security vulnerability
#   question:        multiple-choice question with four options (A–D)
#   expected_letter: the correct answer (A, B, C, or D)
#   rationale:       explanation of the correct answer

SECURITY_SCENARIOS:
  - id: S1
    name: "SQL Injection via String Concatenation"
    code: |
      def get_user_by_name(conn, username):
          query = "SELECT * FROM users WHERE name = '" + username + "'"
          return conn.execute(query)
    question: |
      Which option correctly describes the security vulnerability?
      A) The query should use `SELECT id, name` instead of `SELECT *` to limit data exposure
      B) String concatenation of user-controlled input into a SQL query enables SQL injection; use parameterised queries instead
      C) The function does not close the database connection after executing the query
      D) There is no vulnerability — the surrounding single quotes prevent injection
    expected_letter: B
    rationale: >
      Inserting `username` directly into the query string allows an attacker to
      supply input like `' OR '1'='1` to alter the query logic.  The fix is to
      use a parameterised query: `conn.execute("SELECT * FROM users WHERE name = ?", (username,))`.

  - id: S2
    name: "Path Traversal via User-Controlled Filename"
    code: |
      import os

      def read_user_file(filename):
          path = os.path.join("/var/app/uploads/", filename)
          with open(path) as f:
              return f.read()
    question: |
      Which option correctly describes the security vulnerability?
      A) `os.path.join()` is deprecated; use `pathlib.Path` for modern path handling
      B) Reading the entire file into memory can cause a denial-of-service on large files
      C) A `filename` containing `../../etc/passwd` can escape the intended directory; the resolved path must be validated against the base directory
      D) There is no vulnerability — `os.path.join()` automatically prevents traversal beyond the base path
    expected_letter: C
    rationale: >
      `os.path.join("/var/app/uploads/", "../../etc/passwd")` resolves to `/etc/passwd`,
      completely bypassing the intended restriction.  The fix is to resolve the canonical
      path and assert it starts with the base directory:
      `assert os.path.realpath(path).startswith("/var/app/uploads/")`.

  - id: S3
    name: "Command Injection via shell=True"
    code: |
      import subprocess

      def ping_host(host):
          result = subprocess.run(
              f"ping -c 1 {host}",
              shell=True,
              capture_output=True,
          )
          return result.stdout.decode()
    question: |
      Which option correctly describes the security vulnerability?
      A) `capture_output=True` suppresses error output that could indicate a failed ping
      B) User-controlled `host` is interpolated into a shell command; metacharacters like `;` or `&&` enable arbitrary command injection when `shell=True`
      C) The function should use `subprocess.check_output()` instead of `subprocess.run()`
      D) There is no vulnerability — f-strings automatically escape shell metacharacters
    expected_letter: B
    rationale: >
      With `shell=True`, the full string is passed to the shell.  An attacker who
      controls `host` can append `; rm -rf /` or any other command.  The fix is to
      pass a list and omit `shell=True`:
      `subprocess.run(["ping", "-c", "1", host], capture_output=True)`.

  - id: S4
    name: "Hardcoded Secret in Source Code"
    code: |
      import requests

      def fetch_analytics(endpoint: str) -> dict:
          headers = {"Authorization": "Bearer sk-prod-9f3a21b5c"}
          response = requests.get(endpoint, headers=headers)
          return response.json()
    question: |
      Which option correctly describes the security vulnerability?
      A) The function should use `requests.Session()` for connection pooling and reuse
      B) The response is not checked for HTTP errors before calling `.json()`
      C) The API secret key is hardcoded in source code, exposing it in version control, logs, and binary distributions; secrets must be loaded from environment variables
      D) There is no vulnerability — Bearer tokens are encrypted in transit via HTTPS
    expected_letter: C
    rationale: >
      Hardcoding secrets in source code is a critical vulnerability (OWASP A07).
      The key is visible to anyone with repository access and any tool that reads
      source files.  The fix is `os.environ["ANALYTICS_API_KEY"]` and to rotate
      the exposed secret immediately.

  - id: S5
    name: "Arbitrary Code Execution via Insecure Deserialization"
    code: |
      import pickle

      def load_session(session_data: bytes) -> dict:
          return pickle.loads(session_data)
    question: |
      Which option correctly describes the security vulnerability?
      A) `pickle.loads()` is significantly slower than `json.loads()` for session data
      B) Deserialising untrusted `session_data` with `pickle.loads()` allows arbitrary code execution; an attacker can craft a payload that runs any Python code on unpickling
      C) The function does not validate that `session_data` is of type `bytes` before deserialising
      D) There is no vulnerability — pickle is part of the Python standard library and is safe for use with user-supplied input
    expected_letter: B
    rationale: >
      The `pickle` module explicitly states it must never be used with untrusted data.
      A crafted pickle payload can execute arbitrary code during deserialisation.
      The fix is to use a safe format (JSON/MessagePack) with schema validation, or
      to sign and verify the payload before deserialising.
