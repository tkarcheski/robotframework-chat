# Key-value extraction scenarios.
#
# Each entry has:
#   id:        unique identifier
#   name:      human-readable test name
#   text:      source text containing the attribute
#   attribute: the attribute to extract (natural language description)
#   expected:  ground-truth value (case-insensitive substring match)

KEY_VALUE_SCENARIOS:
  - id: KV1
    name: "Software Version Number"
    text: >
      Release Notes — PyTorch 2.3.0.
      This release introduces torch.compile performance improvements,
      enhanced MPS backend support for Apple Silicon, and fixes to the
      distributed training scheduler introduced in 2.2.0.
    attribute: "software version number being released"
    expected: "2.3.0"

  - id: KV2
    name: "Oven Temperature from Recipe"
    text: >
      Preheat your oven to 190°C (375°F). Place the chicken thighs skin-side
      up in a roasting tin and roast for 35–40 minutes until the skin is
      golden and the internal temperature reads 75°C on a meat thermometer.
    attribute: "oven preheat temperature in Celsius"
    expected: "190"

  - id: KV3
    name: "Clinical Trial Participant Count"
    text: >
      A randomised controlled trial enrolled 2,847 participants aged 40–65
      across six European hospitals. Participants were randomised 1:1 to the
      treatment and placebo arms over a 24-month follow-up period.
    attribute: "total number of participants in the trial"
    expected: "2847"

  - id: KV4
    name: "Open-Source License Type"
    text: >
      This library is distributed under the Apache License, Version 2.0.
      You may use, reproduce, and distribute copies of the Work in any medium,
      with or without modifications, subject to the conditions described in
      Section 4 of the License.
    attribute: "license type"
    expected: "Apache"

  - id: KV5
    name: "Default Server Port"
    text: >
      The development server starts on port 8080 by default. To override this,
      export the PORT environment variable before running the application
      with `npm start`. The production server uses port 443 for HTTPS traffic.
    attribute: "default development server port number"
    expected: "8080"

  - id: KV6
    name: "Company Headquarters Country"
    text: >
      NordWave AS is a Norwegian maritime technology company headquartered in
      Bergen. The firm operates a fleet of autonomous research vessels and
      currently employs approximately 340 people across three offices.
    attribute: "country where the company is headquartered"
    expected: "Norway"

  - id: KV7
    name: "Maximum Upload Size Limit"
    text: >
      Uploads are limited to 50 MB per file. Files larger than this limit must
      be split into multiple parts or compressed before submission. Supported
      formats include PDF, DOCX, and XLSX only.
    attribute: "maximum file upload size in MB"
    expected: "50"
