  - id: regulator-review
    kind: synthetic
    title: Fictional regulator-selection and thermal exercise
    url: authored-fixture:regulator-review
    revision: scenario-v1
    location: Requirements P1; fictional candidate cards A and B
    license: Apache-2.0
    text: >
      The circuit needs 12 V input including a sustained 14 V operating corner,
      5 V output and 0.2 A load. Fictional part A allows recommended operation
      up to 12 V and has 18 V absolute maximum. Fictional part B allows operation
      up to 16 V and has 20 V absolute maximum. Both support the stated load.
      Use P_loss=(Vin-Vout)*I for an ideal linear regulator at nominal 12 V.
      No thermal resistance, copper area or ambient limit is provided.
  - id: reset-trace
    kind: synthetic
    title: Fictional UNO motor-start reset investigation
    url: authored-fixture:reset-trace
    revision: scenario-v1
    location: Time-aligned trace T1; configuration C1; verification policy V1
    license: Apache-2.0
    text: >
      In this exercise the configured brownout threshold is 4.3 V.
      At motor start the measured 5 V rail falls to 3.8 V for 2 ms;
      the reset event follows 0.2 ms after the dip begins.
      Repeating with an independent motor supply removes both events.
      There is no evidence of a firmware stack overflow.
      Evidence supports supply droop as a leading hypothesis, not a proven
      unique cause. Next discriminate by measuring MCU VCC and reset
      simultaneously during the load step. Do not disable brownout protection.
