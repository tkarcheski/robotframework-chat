# Public-document summaries are attributed factual adaptations (CC-BY-SA-4.0
# where stated). Fictional project artifacts are original Apache-2.0 test data.
# Source locations/revisions are frozen; no live web fetch occurs during a run.
documents:
  - id: uno-spec
    kind: public
    title: Arduino UNO R3 technical specifications
    url: https://github.com/arduino/docs-content/blob/09a63fac6577a9d8ad16a69da36deb94721b717e/content/hardware/uno/boards/uno-rev3/tech-specs.yml
    revision: 09a63fac6577a9d8ad16a69da36deb94721b717e
    location: Power, Microcontroller, Clock speed, Memory
    license: CC-BY-SA-4.0; Arduino; factual adaptation
    text: >
      Arduino UNO R3 (A000066) uses ATmega328P. Its I/O voltage is 5 V;
      nominal input voltage is 7-12 V. DC current per I/O pin is 20 mA.
      Main processor clock is 16 MHz. SRAM is 2 KB, flash 32 KB,
      EEPROM 1 KB. It has 14 digital I/O pins and 6 analog input pins.
  - id: uno-power
    kind: public
    title: UNO Rev3 power specifications
    url: https://store-usa.arduino.cc/products/arduino-uno-rev3
    revision: factual snapshot verified 2026-09-25
    location: Tech Specs; Power; Input and Output
    license: Factual summary only; original Arduino page rights retained
    text: >
      Operating voltage is 5 V. Recommended input is 7-12 V;
      input limit is 6-20 V. The 3.3 V pin current specification is 50 mA.
      DC current per I/O pin is 20 mA. The input limit is not a guarantee
      of thermal performance for an arbitrary external load.
  - id: uno-interfaces
    kind: public
    title: UNO interface and conversion functions
    url: https://github.com/arduino/docs-content/blob/09a63fac6577a9d8ad16a69da36deb94721b717e/content/hardware/uno/boards/uno-rev3/tutorials/intro-to-board/intro-to-board.md
    revision: 09a63fac6577a9d8ad16a69da36deb94721b717e
    location: Digital Pins; Analog Pins
    license: CC-BY-SA-4.0; Arduino; factual adaptation
    text: >
      The analog inputs support 10-bit analog-to-digital conversion.
      PWM pins are D3, D5, D6, D9, D10, D11 with 8-bit analogWrite PWM.
      PWM is pulse-width modulation, not a constant analog voltage output.
      UART is D0 (RX), D1 (TX). SPI is D10 (SS), D11 (MOSI),
      D12 (MISO), D13 (SCK). I2C uses A4 (SDA), A5 (SCL).
      A4/A5 have shared analog and I2C roles, not independent pins.
  - id: fire-safety
    kind: public
    title: BeagleV-Fire expansion-header electrical warnings
    url: https://github.com/beagleboard/docs.beagleboard.io/blob/16fe321218239da46f68cc6688347deddd044181/boards/beaglev/fire/04-expansion.rst
    revision: 16fe321218239da46f68cc6688347deddd044181
    location: Cape Headers; Connector P8 notes
    license: CC-BY-SA-4.0; BeagleBoard.org contributors; factual adaptation
    text: >
      P8 and P9 each have 46 pins. Expansion signals are 3.3 V unless
      otherwise indicated. Do not connect 5 V logic signals.
      Do not apply voltage to any I/O when power is not supplied to the board.
      No pins are to be driven until after SYS_RESET goes high.
      These warnings do not specify an ADC full-scale voltage or
      an exact allowable input injection current.
  - id: fire-pinmux
    kind: public
    title: BeagleV-Fire P8.13 function varies with gateware
    url: https://github.com/beagleboard/docs.beagleboard.io/blob/16fe321218239da46f68cc6688347deddd044181/boards/beaglev/fire/04-expansion.rst
    revision: 16fe321218239da46f68cc6688347deddd044181
    location: Connector P8; P8.10-P8.13 table
    license: CC-BY-SA-4.0; BeagleBoard.org contributors; factual adaptation
    text: >
      The gateware image sets each expansion pin's function.
      P8.13 is processor pin GPIO47PB1, ball B10.
      In the DEFAULT image its function is core_pwm[1] at 0x41500000,
      labeled PWM_2:1. In the GPIOS image it is MSS GPIO_2[10],
      labeled User LED 10. A connector label alone does not identify
      the currently loaded gateware.
  - id: fire-gateware
    kind: public
    title: BeagleV-Fire gateware architecture
    url: https://github.com/beagleboard/docs.beagleboard.io/blob/16fe321218239da46f68cc6688347deddd044181/boards/beaglev/fire/demos-and-tutorials/gateware/index.rst
    revision: 16fe321218239da46f68cc6688347deddd044181
    location: Gateware Architecture; Cape Gateware; SYZYGY Gateware; M.2 Gateware
    license: CC-BY-SA-4.0; BeagleBoard.org contributors; factual adaptation
    text: >
      PolarFire SoC combines RISC-V processors and FPGA logic on one die.
      Gateware configures subsystem hardware and FPGA logic.
      Gateware blocks have an APB target interface for control/status registers.
      Some also use AXI for high-volume transfers to/from DDR.
      Clocks of 125 MHz and 160 MHz are provided.
      Cape gateware handles P8/P9 signals. SYZYGY supports up to three
      12.7 Gbps transceivers, but only two can be used when M.2 is enabled.
      To use all three SYZYGY transceivers the M.2 gateware must be omitted.
