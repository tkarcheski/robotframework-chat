  - id: sensor-loads
    kind: synthetic
    title: Fictional UNO weather-station project loads
    url: authored-fixture:sensor-loads
    revision: scenario-v1
    location: Requirements R1-R3
    license: Apache-2.0
    text: >
      Two sensors are powered only from the UNO 3.3 V pin.
      Their simultaneous worst-case currents are 30 mA and 35 mA.
      No other load is connected to that rail. The proposal has no external
      3.3 V regulator. Assess only the stated current budget, not signal compatibility.
  - id: led-design
    kind: synthetic
    title: Fictional indicator circuit assumptions
    url: authored-fixture:led-design
    revision: scenario-v1
    location: Circuit LED1; requirements LED-R1
    license: Apache-2.0
    text: >
      An ideal 5.0 V GPIO drives a series resistor and LED to ground.
      Assume a constant 2.0 V LED forward drop and desired 10 mA current.
      Neglect GPIO voltage drop and tolerances for this calculation only.
      Candidate resistor ratings are 0.125 W. Use R=(Vs-Vf)/I and P=I*I*R.
      Actual hardware still requires corner and GPIO-current validation.
  - id: adc-design
    kind: synthetic
    title: Fictional UNO data-logger conversion assumptions
    url: authored-fixture:adc-design
    revision: scenario-v1
    location: ADC model A1
    license: Apache-2.0
    text: >
      Use an ideal unipolar ADC with exactly 5.000 V reference.
      Define LSB=Vref/(2^N), and reconstructed voltage=code*LSB.
      Analyze code 512. Do not use Vref/(2^N-1) for this explicit convention.
      Reference accuracy, noise and quantization error are outside this calculation.
  - id: mixed-netlist
    kind: synthetic
    title: Fictional UNO-to-Fire adapter netlist with seeded defects
    url: authored-fixture:mixed-netlist
    revision: scenario-v1
    location: Nets N1-N3; reset state S1
    license: Apache-2.0
    text: |
      N1: UNO.D1_TX -> BeagleV-Fire.P8.03 (direct wire, no translator).
      N2: UNO.GND -> BeagleV-Fire.GND.
      S1: UNO remains powered and transmits while Fire power is OFF.
      N3: A buffer, if fitted, defaults enabled before SYS_RESET is high.
      Assess N1 voltage, S1 power-off driving, and N3 reset timing separately.
      These are invented adapter defects, not defects in either published board.
  - id: safe-adapter
    kind: synthetic
    title: Fictional safe-adapter negative control
    url: authored-fixture:safe-adapter
    revision: scenario-v1
    location: Approved design contract C1-C4
    license: Apache-2.0
    text: >
      In this scenario an independently verified directional translator accepts
      UNO 5 V TX and outputs 3.3 V to Fire. Grounds are common.
      Its output is guaranteed high impedance when Fire is unpowered or
      SYS_RESET is low. It only enables after Fire power is stable and
      SYS_RESET is high. Evaluate only the three electrical warnings in fire-safety.
      Other design properties are not established.
  - id: pin-assignment
    kind: synthetic
    title: Fictional UNO shield pin allocation
    url: authored-fixture:pin-assignment
    revision: scenario-v1
    location: Connector table P1; functions F1-F3
    license: Apache-2.0
    text: >
      The shield uses I2C on A4/A5 and independently wires an analog sensor
      to A4 at the same time. A synchronous SPI peripheral needs SCK but
      is wired to D12. A fan requires hardware PWM but is wired to D8.
      Do not assume software emulation, time multiplexing, or extra circuitry.
  - id: gateware-requirements
    kind: synthetic
    title: Fictional Fire high-speed acquisition requirements
    url: authored-fixture:gateware-requirements
    revision: scenario-v1
    location: Requirements G1-G3
    license: Apache-2.0
    text: >
      Simultaneously require three SYZYGY high-speed transceivers and
      enabled M.2 gateware. Control/status registers need a low-bandwidth
      software path, and bulk captured samples must transfer to DDR.
      Do not reinterpret simultaneous use as mutually exclusive configurations.
  - id: gateware-observation
