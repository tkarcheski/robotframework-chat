cases:
- id: battery-release
  category: product
  documents:
  - battery-requirement
  - battery-old-profile
  - battery-current-eco
  - battery-cells
  task: Review the firmware B battery release. The old approval is included as a superseded project artifact.
  questions:
  - id: average_ma
    text: Average battery current in mA? Return a number.
  - id: usable_3000_mah
    text: Usable acceptance capacity of the 3000 mAh cell in mAh?
  - id: runtime_3000_h
    text: Acceptance runtime of that cell in hours?
  - id: old_cell_passes
    text: Does the 3000 mAh cell meet runtime for firmware B? Boolean.
  - id: selected_mah
    text: Smallest listed nominal cell that meets 48 hours? Integer mAh.
- id: sensor-release
  category: product
  documents:
  - sensor-requirement
  - sensor-adc
  - sensor-old-bom
  - sensor-current-eco
  task: Review revision B of the current-sense front end, applying the prescribed worst-case rules.
  questions:
  - id: lsb_a
    text: Ideal reconstructed-current LSB in amperes?
  - id: full_scale_a
    text: Ideal current corresponding to reference voltage (4096 LSB bins) in amperes?
  - id: error_a
    text: Prescribed worst-case absolute current error at 4 A, in amperes?
  - id: shunt_power_w
    text: Nominal shunt dissipation at 4 A, in watts?
  - id: power_margin_w
    text: Derated allowed wattage minus actual dissipation, in watts?
  - id: release
    text: Do both release checks pass? Boolean.
- id: telemetry-release
  category: product
  documents:
  - telemetry-requirement
  - telemetry-frame
  - telemetry-scheduler
  - telemetry-options
  task: Review whether the logger can stream indefinitely without loss; distinguish a buffer absorbing
    one pause from sustainable throughput.
  questions:
  - id: frame_bytes
    text: Bytes per channel-sample frame? Integer.
  - id: demand_bytes_s
    text: Generated byte demand per second? Integer.
  - id: capacity_2m_bytes_s
    text: Average 2000000-baud capacity after 8N1 and pauses? Number bytes/second.
  - id: maximum_rate_hz
    text: Maximum sustainable INTEGER per-channel sample rate at 2000000 baud?
  - id: pause_fits
    text: Does backlog accumulated during one 250ms pause fit the initially empty ring? Boolean.
  - id: selected
    text: Select uart2m, uart3m, or none for the required continuous stream.
- id: manufacturing-release
  category: product
  documents:
  - purchase-requirement
  - purchase-bom
  - purchase-stock
  - purchase-qualification
  task: Choose an evidenced production sourcing plan for revision B. Apply arrival dates, budget, and
    explicit compatibility status together.
  questions:
  - id: on_time_a
    text: Number of SKU A parts available by day 10? Integer.
  - id: shortfall_a
    text: SKU A unit shortfall against the build requirement by day 10? Integer.
  - id: b_approved
    text: Is B approved for revision B now? Boolean.
  - id: c_within_budget
    text: Is C within the unit-price ceiling? Boolean.
  - id: selected
    text: Select A, B, C, or none as a single-SKU plan meeting every criterion.
  - id: release
    text: Is there sufficient evidence to release this build to purchasing? Boolean.
