# Date arithmetic test cases.
#
# Each entry has:
#   id:              unique identifier
#   name:            human-readable test name
#   question:        the question to ask the LLM
#   expected_answer: the correct integer answer

DATE_ARITHMETIC_CASES:
  # ── Calendar knowledge ─────────────────────────────────────────────────────
  - id: DA1
    name: "February Days Non-Leap Year"
    question: >
      How many days are in the month of February during a standard non-leap year?
    expected_answer: 28

  - id: DA2
    name: "Days in a Non-Leap Year"
    question: >
      How many days are there in a standard non-leap year?
    expected_answer: 365

  - id: DA3
    name: "Days in a Leap Year"
    question: >
      How many days are there in a leap year?
    expected_answer: 366

  - id: DA4
    name: "Days in April"
    question: >
      How many days are there in the month of April?
    expected_answer: 30

  - id: DA5
    name: "Days in Q1 Non-Leap Year"
    question: >
      In a standard non-leap year, how many total days are in January, February,
      and March combined?
    expected_answer: 90

  - id: DA6
    name: "31-Day Months Count"
    question: >
      How many months of the year have exactly 31 days?
    expected_answer: 7
