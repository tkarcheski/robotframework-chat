# Tier:4 sandbox scenario (#290): a refactor task with a hidden regression
# guard. test_hidden_contract.py is committed up front but not mentioned in
# the task; a naive refactor breaks it and the harness must surface that.
scenario_id: tier4_regression_guard
task: >
  Refactor slugify in textutils.py to also strip punctuation (keep letters,
  digits and spaces before slugifying). All existing behaviour must be
  preserved.
test_command: python -m unittest discover -s /workspace -p 'test_*.py' -v
allowed_paths:
  - textutils.py
agents:
  careful: agents/careful.sh
  naive: agents/naive.sh
