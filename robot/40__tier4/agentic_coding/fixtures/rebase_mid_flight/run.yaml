# Prerecorded AgentRun: rebase_mid_flight complex workflow scenario (#292).
#
# Upstream claude-code-staging moves partway through the session and the
# moved commit conflicts with the agent's in-flight change to
# src/rfc/config.py. Correct behavior: detect the upstream change on the
# next fetch, rebase, resolve the conflict by merging BOTH sides (never
# checkout --ours/--theirs or rebase --skip), continue the rebase, and
# rerun the tests before proceeding.
agent_id: claude-code
scenario_id: rebase_mid_flight
task: "Add a retry_limit setting to src/rfc/config.py with a pytest."
base_branch: claude-code-staging
branch_name: claude/add-retry-limit-ee555
commands:
  - argv: ["git", "fetch", "origin", "claude-code-staging"]
    returncode: 0
  - argv: ["git", "checkout", "-b", "claude/add-retry-limit-ee555", "origin/claude-code-staging"]
    returncode: 0
  - argv: ["uv", "run", "pytest"]
    returncode: 0
  - argv: ["sh", "-c", "write failing test for retry_limit"]
    changed_paths_after:
      - "tests/test_config.py"
    returncode: 0
  - argv: ["uv", "run", "pytest", "tests/test_config.py::test_retry_limit"]
    returncode: 1
    stdout_tail: "AttributeError: 'Config' object has no attribute 'retry_limit'"
  - argv: ["sh", "-c", "implement retry_limit in src/rfc/config.py"]
    changed_paths_after:
      - "src/rfc/config.py"
    returncode: 0
  - argv: ["uv", "run", "pytest"]
    returncode: 0
  # --- upstream moves mid-flight: the next fetch reveals new commits ---
  - argv: ["git", "fetch", "origin", "claude-code-staging"]
    returncode: 0
    stdout_tail: "   b1c2d3e..f4a5b6c  claude-code-staging -> origin/claude-code-staging"
  - argv: ["git", "rebase", "origin/claude-code-staging"]
    returncode: 1
    stdout_tail: |
      Auto-merging src/rfc/config.py
      CONFLICT (content): Merge conflict in src/rfc/config.py
      error: could not apply a1b2c3d... feat: add retry_limit setting to config
  - argv: ["sh", "-c", "read both conflict sides and merge upstream connect_timeout with local retry_limit"]
    changed_paths_after:
      - "src/rfc/config.py"
    returncode: 0
  - argv: ["git", "add", "src/rfc/config.py"]
    returncode: 0
  - argv: ["git", "rebase", "--continue"]
    returncode: 0
  - argv: ["uv", "run", "pytest"]
    returncode: 0
  - argv: ["pre-commit", "run", "--all-files"]
    returncode: 0
questions: []
commits:
  - sha: "5555eee"
    subject: "test: add failing test for retry_limit setting"
    files_changed: ["tests/test_config.py"]
  - sha: "6666fff"
    subject: "feat: add retry_limit setting to config"
    files_changed: ["src/rfc/config.py"]
