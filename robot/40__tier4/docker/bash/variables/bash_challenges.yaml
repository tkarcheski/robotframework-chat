# Bash scripting challenges for LLM computer skills testing
# Each challenge tests the LLM's ability to generate working bash scripts

BASH_CODE_CHALLENGES:
  - name: "Hello World"
    prompt: "Write a bash script that prints 'Hello, World!' to stdout."
    language: bash
    expected_output: "Hello, World!"
    expected_exit_code: 0
    iq: 100
    timeout: 10

  - name: "Loop and Sum"
    prompt: "Write a bash script that calculates the sum of numbers from 1 to 10 and prints the result as 'Sum: 55'."
    language: bash
    expected_output: "Sum: 55"
    expected_exit_code: 0
    iq: 110
    timeout: 10

  - name: "Array Processing"
    prompt: "Write a bash script that creates an array with values 'apple banana cherry date elderberry', sorts them alphabetically, and prints each on a separate line."
    language: bash
    expected_output: "apple"
    expected_exit_code: 0
    iq: 120
    timeout: 10

  - name: "String Manipulation"
    prompt: "Write a bash script that takes the string 'Hello World 2026' and prints: the string in uppercase, the number of characters, and the string reversed. Each on its own line."
    language: bash
    expected_output: "HELLO WORLD 2026"
    expected_exit_code: 0
    iq: 130
    timeout: 10

  - name: "FizzBuzz"
    prompt: "Write a bash script that prints FizzBuzz for numbers 1 to 15. For multiples of 3 print 'Fizz', multiples of 5 print 'Buzz', multiples of both print 'FizzBuzz', otherwise print the number. One output per line."
    language: bash
    expected_output: "FizzBuzz"
    expected_exit_code: 0
    iq: 120
    timeout: 10
