# C Interview Questions - Pointers, Memory, and Core Language Behavior
#
# 25 questions testing LLM knowledge of fundamental C concepts.
# Each entry has a question, expected answer summary, and IQ level.

C_CORE_QUESTIONS:
  - question: "What is a pointer in C and why is it useful?"
    expected: "A pointer stores the memory address of another variable, enabling dynamic memory allocation, arrays and strings handling, call-by-reference, and efficient data structures like linked lists and trees."
    iq: 100

  - question: "What is the difference between 'int *p;' and 'int a[10];' in C?"
    expected: "'int *p;' declares a pointer that can point to an int, while 'int a[10];' declares an array of 10 ints with fixed size; arrays have storage, pointers do not."
    iq: 100

  - question: "What is a void * pointer in C and when would you use it?"
    expected: "A void * is a generic pointer that can hold the address of any data type, commonly used in generic functions and libraries; it must be cast to a concrete type before dereferencing."
    iq: 110

  - question: "What is pointer arithmetic in C?"
    expected: "Pointer arithmetic adds or subtracts integer offsets in units of the pointed-to type's size, e.g., p + 1 for int *p advances by sizeof(int) bytes."
    iq: 110

  - question: "What is a dangling pointer in C?"
    expected: "A dangling pointer points to memory that has been freed or gone out of scope; using it causes undefined behavior, so it should be set to NULL after free."
    iq: 110

  - question: "What is a wild (uninitialized) pointer in C?"
    expected: "A wild pointer is a pointer that has not been initialized to a known address (like NULL); dereferencing it is undefined behavior."
    iq: 100

  - question: "What is the difference between 'const char *p' and 'char * const p' in C?"
    expected: "'const char *p' is a pointer to constant data (you cannot change the chars via p), while 'char * const p' is a constant pointer to mutable data (you cannot change p to point elsewhere)."
    iq: 120

  - question: "How do you dynamically allocate and free memory for an array of 10 ints in C?"
    expected: "Use malloc and free: int *p = malloc(10 * sizeof *p); if (!p) { handle error } use p; free(p); p = NULL; This allocates 10 ints on the heap and then releases them."
    iq: 110

  - question: "What happens if you free the same pointer twice in C?"
    expected: "Double-freeing leads to undefined behavior, often crashes or security issues, because the allocator's internal structures are corrupted."
    iq: 110

  - question: "What is the difference between stack and heap memory in C?"
    expected: "Stack memory is automatically managed, fast, and has function-scope lifetime, while heap memory is manually managed with malloc/free and has dynamic lifetime until explicitly freed."
    iq: 100

  - question: "What is the sizeof operator in C and when is it evaluated?"
    expected: "sizeof yields the size in bytes of a type or object and is evaluated at compile time for known types, though on variable length arrays it's evaluated at run time."
    iq: 100

  - question: "What is a function pointer in C?"
    expected: "A function pointer stores the address of a function with a given signature, enabling callbacks and tables of functions, e.g. int (*fptr)(int, int) = add;."
    iq: 120

  - question: "How do you pass a function pointer to another function in C?"
    expected: "By using its type in the parameter list, for example: int operate(int a, int b, int (*op)(int, int)) { return op(a, b); }"
    iq: 120

  - question: "What is the difference between ++i and i++ in C?"
    expected: "++i increments and then yields the new value, whereas i++ yields the old value and then increments; in many simple contexts the generated code is identical."
    iq: 100

  - question: "What is undefined behavior in C? Give an example."
    expected: "Undefined behavior means the C standard imposes no requirements; any result is possible. Example: reading an uninitialized variable, or out-of-bounds array access."
    iq: 110

  - question: "What is the difference between memcpy and memmove in C?"
    expected: "memcpy copies bytes assuming non-overlapping regions; memmove is safe for overlapping memory by handling the copy direction to avoid corruption."
    iq: 110

  - question: "Explain what 'static' does when used on a local variable inside a function in C."
    expected: "A static local variable is initialized once and retains its value between function calls, with no linkage (block scope) and static storage duration."
    iq: 110

  - question: "What does 'static' mean at file scope on a function or global variable in C?"
    expected: "It gives internal linkage, restricting visibility to that translation unit, so the symbol cannot be referenced from other source files."
    iq: 110

  - question: "How are strings represented in C?"
    expected: "As arrays of char terminated by a null byte '\\0'; functions operating on C strings rely on this terminator to find the string's length."
    iq: 100

  - question: "What is the difference between strlen and sizeof when used on a string in C?"
    expected: "strlen computes the length of the string up to the null terminator at run time, while sizeof returns the total size of the array in bytes (including the terminator when used on an array)."
    iq: 110

  - question: "What is a segmentation fault and what typically causes it in C?"
    expected: "It's a crash caused by accessing memory that the process is not allowed to read or write, often due to invalid pointers or out-of-bounds accesses."
    iq: 100

  - question: "How do you prevent buffer overflows when reading input in C?"
    expected: "Use bounded functions and specify buffer sizes, e.g. fgets(buf, sizeof buf, stdin), validate lengths, and avoid unsafe functions like gets."
    iq: 110

  - question: "What is a struct in C and how is it different from an array?"
    expected: "A struct groups fields of possibly different types under one name, whereas an array is a sequence of elements of the same type."
    iq: 100

  - question: "How do you allocate memory for a struct and access its members via a pointer in C?"
    expected: "Use malloc: struct Point *p = malloc(sizeof *p); p->x = 1; p->y = 2; free(p); Use -> to access members through a pointer."
    iq: 110

  - question: "What is the difference between #define macros and inline functions in C?"
    expected: "Macros are preprocessor text substitutions with no type checking and can cause subtle bugs, while inline functions are type-checked C functions the compiler may expand without call overhead."
    iq: 120
