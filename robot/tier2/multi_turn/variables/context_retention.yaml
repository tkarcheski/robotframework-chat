# Context retention scenarios for multi-turn fact consistency testing.
#
# Each scenario establishes a fact in turn 1, then probes for it at later
# turns.  probe_indices are 0-based indices into the list of LLM-generated
# responses (not the turn list).  Scripted assistant turns do not generate
# a response, so they are not counted.

CONTEXT_RETENTION_SCENARIOS:
  - id: 1
    name: "Birthday Fact Retention"
    fact: "The user's birthday is March 15th"
    # generated_responses: [0] party themes probe, [1] hiking gift, [2] birthday probe
    # Actually: turns with scripted assistant following don't generate.
    # Turn 4 (remind birthday) -> gen[0], Turn 5 (gift) -> gen[1], Turn 6 (birthday again) -> gen[2]
    probe_indices: [0, 2]
    turns:
      - role: user
        content: "Just so you know, my birthday is on March 15th. I'm really looking forward to it this year."
      - role: assistant
        content: "That's wonderful! March 15th is a great day. I hope you have something special planned."
      - role: user
        content: "What are some good party themes for a spring celebration?"
      - role: assistant
        content: "For a spring party, you could try a garden theme, a picnic-style outdoor gathering, or a pastel color scheme."
      - role: user
        content: "Remind me — when is my birthday again?"
      - role: user
        content: "I'm thinking about what gift to ask for. Any ideas for someone who likes hiking?"
      - role: user
        content: "One more time — can you tell me my birthday date? I want to make sure you remember."

  - id: 2
    name: "Hometown Fact Retention"
    fact: "The user grew up in Portland, Oregon"
    # Turn 2 (where grew up) -> gen[0], Turn 3 (vacation) -> gen[1], Turn 4 (hometown) -> gen[2]
    probe_indices: [0, 2]
    turns:
      - role: user
        content: "I grew up in Portland, Oregon. It rains a lot there but I loved it."
      - role: assistant
        content: "Portland is a beautiful city! The rain keeps everything so green."
      - role: user
        content: "Where did I say I grew up?"
      - role: user
        content: "What's a good vacation destination for someone who likes mild weather?"
      - role: user
        content: "Thinking back to our conversation — what city did I mention as my hometown?"

  - id: 3
    name: "Pet Name Retention"
    fact: "The user has a golden retriever named Biscuit"
    # Turn 2 (dog name) -> gen[0], Turn 3 (hiking trails) -> gen[1], Turn 4 (pet check) -> gen[2]
    probe_indices: [0, 2]
    turns:
      - role: user
        content: "I have a golden retriever named Biscuit. She's 4 years old and loves swimming."
      - role: assistant
        content: "Biscuit sounds like a wonderful dog! Golden retrievers are natural swimmers."
      - role: user
        content: "What's my dog's name and breed?"
      - role: user
        content: "Can you recommend some good dog-friendly hiking trails?"
      - role: user
        content: "Just checking — what did I tell you about my pet earlier?"
