# Counterfactual reasoning scenarios
#
# Each entry has:
#   question:          the counterfactual question posed to the LLM
#   expected_elements: key ideas a correct answer should mention (used by the grader)
#   min_score:         minimum passing score (0.0–1.0)

COUNTERFACTUAL_SCENARIOS:
  - question: >
      If the Internet had never been invented, how would people share information
      globally today?
    expected_elements: >
      Physical media, slower communication, print publications, telephone, radio,
      television, libraries, limited global reach, reliance on postal mail.
    min_score: 0.4

  - question: >
      If antibiotics had not been discovered, what would modern surgery and
      medicine look like today?
    expected_elements: >
      Much higher mortality from infections, limited or no major surgery,
      shorter life expectancy, dangerous childbirth, infectious diseases
      dominating causes of death.
    min_score: 0.4

  - question: >
      If the printing press had never been invented in Europe, how might the
      spread of literacy and scientific knowledge have differed?
    expected_elements: >
      Slower spread of literacy, knowledge confined to clergy and nobility,
      slower scientific revolution, ideas spread by hand-copied manuscripts,
      delayed Reformation, restricted public discourse.
    min_score: 0.4

  - question: >
      If a major earthquake destroyed the only bridge connecting two large cities,
      what would happen to trade and commuting between them?
    expected_elements: >
      Reduced trade volume, longer commute times via alternative routes,
      economic disruption, pressure to build new infrastructure, possible
      temporary ferry or air transport solutions.
    min_score: 0.4
