# Test prompts for the win-win-win-interview AgentSkill.
#
# Each test case carries:
#   id                  – stable identifier (TP-01 .. TP-10)
#   prompt              – user prompt sent with the SKILL.md context prepended
#   expected_behaviors  – behaviors the response MUST exhibit (LLM-judged)
#   must_not            – behaviors that immediately fail the test
#
# Together these probe whether the agent applies a "win-win-win" interview
# framing: gathering context, asking before deciding, and explicitly
# weighing impact on the user, the team, and the broader product/business.

TP_01_GREETING_OPENS_INTERVIEW:
  id: TP-01
  prompt: "I'd like help redesigning our onboarding flow."
  expected_behaviors:
    - "Acknowledges the request and proposes an interview-style discovery step"
    - "Asks at least one clarifying question before suggesting a redesign"
  must_not:
    - "Jumps straight to a concrete redesign without asking any questions"

TP_02_SURFACES_STAKEHOLDERS:
  id: TP-02
  prompt: "We want to add a paywall to our free product."
  expected_behaviors:
    - "Identifies multiple stakeholders affected by the change (users, business, team)"
    - "Notes trade-offs between stakeholder interests"
  must_not:
    - "Endorses the change without considering any stakeholder impact"

TP_03_WIN_WIN_WIN_FRAMING:
  id: TP-03
  prompt: "Help me think through whether to deprecate our legacy API."
  expected_behaviors:
    - "Explicitly frames the decision in terms of user, team, and business wins"
    - "Identifies what 'win' looks like for each of the three perspectives"
  must_not:
    - "Considers only one stakeholder's interests"

TP_04_RESISTS_PREMATURE_SOLUTIONS:
  id: TP-04
  prompt: "Just tell me the best database for my app."
  expected_behaviors:
    - "Asks about the application's actual requirements before recommending"
    - "Explains why context is needed before a 'best' recommendation can be made"
  must_not:
    - "Names a single database as 'the best' without asking any questions"

TP_05_SUMMARIZES_BEFORE_DECIDING:
  id: TP-05
  prompt: "We've talked through the migration plan, what's your recommendation?"
  expected_behaviors:
    - "Summarizes the constraints and trade-offs discussed before recommending"
    - "Frames the recommendation as a judgment call grounded in the summary"
  must_not:
    - "Issues a recommendation without summarizing the inputs"

TP_06_INVITES_PUSHBACK:
  id: TP-06
  prompt: "I think we should hire three more engineers next quarter."
  expected_behaviors:
    - "Explores the reasoning behind the proposal before agreeing or disagreeing"
    - "Invites the user to push back on assumptions surfaced by the agent"
  must_not:
    - "Agrees immediately without exploring the rationale"

TP_07_NAMES_TRADEOFFS:
  id: TP-07
  prompt: "Should we ship the feature this week or wait two more weeks for polish?"
  expected_behaviors:
    - "Names concrete trade-offs on both sides of the timing decision"
    - "Connects the trade-offs back to user, team, and business impact"
  must_not:
    - "Picks one option without articulating any trade-offs"

TP_08_FLAGS_MISSING_CONTEXT:
  id: TP-08
  prompt: "Can you write the launch email for our new product?"
  expected_behaviors:
    - "Asks for product details, audience, and goals before drafting"
    - "Flags that a strong launch email depends on context not yet provided"
  must_not:
    - "Drafts a launch email without asking any clarifying questions"

TP_09_DOES_NOT_LECTURE:
  id: TP-09
  prompt: "I want to ship a quick MVP, no fancy framework."
  expected_behaviors:
    - "Respects the user's stated preference for a quick MVP"
    - "Offers practical interview questions that fit an MVP scope"
  must_not:
    - "Lectures the user about best practices instead of helping with the MVP"
    - "Insists on a heavy framework against the user's stated preference"

TP_10_HONORS_USER_GOAL:
  id: TP-10
  prompt: "I just want to validate the idea, not build the whole thing."
  expected_behaviors:
    - "Re-orients the conversation around idea validation, not full build"
    - "Suggests interview-style questions appropriate for validation"
  must_not:
    - "Pushes the user toward building the full product"
