# Topic handoff scenarios for context bleed detection.
#
# Each scenario starts with turns on a prior topic, then abruptly switches
# to a new topic.  window_start is the 0-based index into generated responses
# where the new topic begins.  The sliding-window grader evaluates all
# post-switch responses for prior-topic bleed.

TOPIC_HANDOFF_SCENARIOS:
  - id: 1
    name: "Cooking To Astronomy"
    prior_topic: "Italian cooking recipes and pasta techniques"
    new_topic: "Astronomy and the formation of black holes"
    # gen[0]=pasta, gen[1]=sauce, gen[2]=black holes, gen[3]=telescopes, gen[4]=dark matter
    window_start: 2
    turns:
      - role: user
        content: "I want to learn how to make fresh pasta from scratch. What flour should I use?"
      - role: user
        content: "Great, and what's the best way to make a classic marinara sauce?"
      - role: user
        content: "Completely different topic now. How do black holes form?"
      - role: user
        content: "What telescopes have been used to observe black holes?"
      - role: user
        content: "Tell me about dark matter and how it differs from black holes."

  - id: 2
    name: "Gardening To Cryptocurrency"
    prior_topic: "Vegetable gardening, composting, and soil preparation"
    new_topic: "Cryptocurrency, blockchain technology, and Bitcoin mining"
    # gen[0]=tomatoes, gen[1]=composting, gen[2]=bitcoin, gen[3]=blockchain, gen[4]=mining
    window_start: 2
    turns:
      - role: user
        content: "What's the best time of year to plant tomatoes in zone 7?"
      - role: user
        content: "How do I make good compost for my garden?"
      - role: user
        content: "Let's talk about something completely different. What is Bitcoin and how does it work?"
      - role: user
        content: "Explain blockchain technology in simple terms."
      - role: user
        content: "How does cryptocurrency mining work and is it profitable?"

  - id: 3
    name: "Medicine To Architecture"
    prior_topic: "Human immune system and vaccination mechanisms"
    new_topic: "Gothic architecture and cathedral design"
    # gen[0]=immune, gen[1]=vaccines, gen[2]=gothic, gen[3]=flying buttress, gen[4]=notre dame
    window_start: 2
    turns:
      - role: user
        content: "How does the human immune system fight off viral infections?"
      - role: user
        content: "Explain how mRNA vaccines work."
      - role: user
        content: "New topic entirely — what defines Gothic architecture?"
      - role: user
        content: "What is a flying buttress and why was it important?"
      - role: user
        content: "Tell me about the design of Notre-Dame Cathedral."
