[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotframework-chat"
version = "1.30.0"
description = "Robot Framework-based test harness for systematically testing LLMs"
license = "Apache-2.0"
readme = "readme.md"
requires-python = ">=3.11"
keywords = ["robotframework", "testing", "llm", "ollama", "openai", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Robot Framework",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "docker==7.1.0",
    "idna==3.11",
    "iniconfig==2.3.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "pytest==9.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "redis>=5.0",
    "requests==2.32.5",
    "robotframework==7.4.1",
    "robotframework-lint==1.1",
    "robotframework-requests>=0.9.7",
    "urllib3==2.6.2",
]

[project.scripts]
rfc = "rfc.harness_cli:main"

[project.urls]
Homepage = "https://github.com/tkarcheski/robotframework-chat"
Repository = "https://github.com/tkarcheski/robotframework-chat"
Issues = "https://github.com/tkarcheski/robotframework-chat/issues"

[project.optional-dependencies]
playwright = [
    "robotframework-browser>=18.0.0",
    "markdownify>=0.14.1",
]
superset = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]
swebench = [
    "swebench>=2.1.0",
    "datasets>=2.19.0",
]
dev = [
    "pre-commit",
    "python-dotenv",
    "ruff==0.14.10",
    "mypy==1.10.0",
    "types-requests",
    "types-PyYAML",
    "types-docker",
    "pytest-cov",
    "pip-audit",
    "build",
    "twine",
    "fakeredis>=2.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/rfc", "scripts"]
omit = ["*/conftest.py", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
mypy_path = "src"
packages = ["rfc"]
explicit_package_bases = true
ignore_missing_imports = false
exclude = ["^scripts/", "^tests/"]

[[tool.mypy.overrides]]
module = ["robot.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy",
    "sqlalchemy.*",
    "superset.*",
    "psycopg2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "swebench",
    "swebench.*",
    "datasets",
    "datasets.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "redis",
    "redis.*",
    "fakeredis",
    "fakeredis.*",
]
ignore_missing_imports = true

# Optional private submodule (modules/graylog), absent from default installs.
[[tool.mypy.overrides]]
module = [
    "robot_graylog_llm",
    "robot_graylog_llm.*",
    "robot_graylog_builtin",
    "robot_graylog_builtin.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/rfc"]
