# pilots/ holds verbatim run artifacts (model output, raw logs) that must
# stay byte-exact — formatters and whitespace fixers would corrupt evidence.
exclude: ^pilots/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--explicit-package-bases]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-docker
          - types-beautifulsoup4
          - markdownify
        exclude: ^(scripts|tests|robot/40__tier4/agentic_coding/fixtures/sandbox)/

  - repo: local
    hooks:
      - id: no-ftp
        name: Block FTP usage
        entry: '(?i)(import\s+ftplib|from\s+ftplib|import\s+paramiko|from\s+paramiko|ftp_sender)'
        language: pygrep
        types: [python]

      - id: robot-modified-tests
        name: Robot Framework (modified tests via uv)
        entry: uv run robot -d results/.pre-commit
        language: system
        stages: [post-commit]
        files: \.robot$
        pass_filenames: true
