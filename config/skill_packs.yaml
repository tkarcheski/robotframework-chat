# External skill packs — forked repos submoduled under vendor/skill-packs/.
# Fork-first policy: never submodule an upstream you don't control (ai/GIT.md).
# After editing this file or .skillignore, or bumping a pack submodule, run:
#   uv run python scripts/sync_skill_packs.py
packs:
  - name: mattpocock
    path: vendor/skill-packs/mattpocock
    prefix: mp-
    glob: "skills/*/*/SKILL.md"
    upstream: https://github.com/mattpocock/skills
    fork: git@github.com:tkarcheski/mattpocock-skills.git
