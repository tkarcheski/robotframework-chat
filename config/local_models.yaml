# ---------------------------------------------------------------------------
# External OpenAI-compatible providers (issue #507)
#
# Each entry is a remote API served through the existing OpenAIClient
# (LLM_PROVIDER=openai). A provider whose api_key_env variable is unset is
# skipped with a log line (skip-and-log), so this section is inert until
# credentials exist. Free-pool model ids are discovered at run time from
# {base_url}/models (ids ending in ":free") — never hardcoded, the pool
# churns. Results are watermarked as "<name>/<model-id>".
# ---------------------------------------------------------------------------
providers:
  - name: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    # Static model ids to always run (paid or free); raw OpenRouter ids.
    models: []
    # Discover the ":free" pool from /models at run time.
    discover_free_pool: true
    # Free-pool budget after the one-time $10 credit unlock.
    max_requests_per_day: 1000
    requests_per_minute: 20
    # ~LLM calls one (model, suite) run makes; used for budget/pacing math.
    requests_per_suite_estimate: 15

  # Groq free tier, 30 RPM. llama-3.1-8b-instant is the scheduled (first)
  # model: 14,400 req/day and a token/day budget large enough to complete a
  # full sweep. llama-3.3-70b-versatile is intentionally NOT scheduled here —
  # its free-plan cap is 100K tokens/day (≈100 calls), far below a 42-suite
  # sweep (~630 calls), so it would 429 partway through (#521). Token-aware
  # budgeting that could safely mix both models is tracked in #515.
  - name: "groq"
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    models:
      - "llama-3.1-8b-instant"
    discover_free_pool: false
    max_requests_per_day: 1000
    requests_per_minute: 30
    requests_per_suite_estimate: 15
    # llama-3.1-8b-instant context window is 131,072 (output cap 8,192), so the
    # benchmark suite (num_ctx 131,584) is skipped here via the context cap.
    # Groq's free 6K tokens/min still can't sustain token-heavy suites; precise
    # per-minute-token pacing is tracked in #515.
    max_context_tokens: 131072

  # Cerebras free tier: 1M tokens/day, 30 RPM, 8K context cap. gpt-oss-120b is
  # the only current production model here — every Llama (incl. llama3.1-8b,
  # deprecated 2026-05-27) and the older Qwen 3 32B have been retired
  # (inference-docs.cerebras.ai/support/deprecation), and scheduling a retired
  # id fails every suite instead of skipping. Budget: at ~1.4K tokens per small
  # eval request (8K-ctx cap, 256 default max_tokens), 1M tokens/day ≈ 700
  # requests — enough for one model across the full suite set (42 x 15 ≈ 630).
  # Suites declaring min_context_tokens > 8192 are skipped with a log (#509).
  - name: "cerebras"
    base_url: "https://api.cerebras.ai/v1"
    api_key_env: "CEREBRAS_API_KEY"
    models:
      - "gpt-oss-120b"
    discover_free_pool: false
    max_requests_per_day: 700
    requests_per_minute: 30
    requests_per_suite_estimate: 15
    max_context_tokens: 8192

  # Google AI Studio free tier via the OpenAI-compatible endpoint.
  # gemini-2.5-flash-lite is the current GA Flash model whose free-tier quota
  # (15 RPM / 1,000 RPD) can actually sustain a full sweep — gemini-2.5-flash
  # is only 10 RPM / 250 RPD (too low for ~630 requests) and gemini-2.0-flash
  # was shut down 2026-06-01 (ai.google.dev/gemini-api/docs/rate-limits,
  # /docs/deprecations) (#521).
  - name: "google-ai-studio"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: "GOOGLE_AI_STUDIO_API_KEY"
    models:
      - "gemini-2.5-flash-lite"
    discover_free_pool: false
    max_requests_per_day: 1000
    requests_per_minute: 15
    requests_per_suite_estimate: 15

# ---------------------------------------------------------------------------
# Cost & usage telemetry (issue #511)
# ---------------------------------------------------------------------------
# Static price table for estimating spend on PAID external models, in USD per
# million tokens. Every provider configured above is a *free* tier, so none are
# listed here and their estimated cost is $0; add an entry (keyed by the raw
# model id) when a paid model is introduced. See src/rfc/cost_estimator.py.
pricing: {}
#   openai/gpt-4o:
#     input_per_mtok: 2.5
#     output_per_mtok: 10.0

# Monthly spend cap in USD. project-management's systems sweep flags >80% burn
# as from:pm type:monitoring (0 disables the alarm).
monthly_budget_usd: 20

# ---------------------------------------------------------------------------
# Robot Framework execution settings
# ---------------------------------------------------------------------------
execution:
  # Output directory template — {node} and {model} are replaced at runtime
  output_dir: "results/local/{node}/{model}"
  # Extra Robot Framework CLI flags applied to every run
  extra_args: []
  # Attach standard listeners to every run
  listeners:
    - "rfc.db_listener.DbListener"
    - "rfc.git_metadata_listener.GitMetaData"
    - "rfc.ollama_timestamp_listener.OllamaTimestampListener"
    - "rfc.agent_workflow_listener.AgentWorkflowListener"
    - "rfc.agentic_harness_listener.AgenticHarnessListener"
    - "rfc.dialog_listener.DialogListener"
    - "rfc.generative_listener.GenerativeListener"
  # Continue to next model even if a suite fails
  continue_on_failure: true
  # Maximum parallel model runs (1 = sequential)
  parallel: 1
  # Probe each model with one tiny prompt before running its suites; a model
  # that errors or returns an empty response (issue #426: glm-4.7-flash:q8_0)
  # is recorded as failed and skipped instead of churning through every test.
  preflight: true
  # Max seconds for the preflight probe — generous, because cold-loading a
  # large model can take tens of minutes.
  preflight_timeout: 1800
