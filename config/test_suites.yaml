# Test Suite Configuration - Single Source of Truth
#
# This file drives test configuration for local runs and CI
# (GitHub Actions).
#
# See src/rfc/suite_config.py for the Python loader.

defaults:
  iq_levels: ["70", "80", "90", "100", "110", "120", "130", "140", "150", "160"]
  model: "phi4:14b"
  profile: "STANDARD"
  timeout_seconds: 120
  max_retries: 2
  ollama_endpoint: "http://localhost:11434"

# ---------------------------------------------------------------------------
# Ollama Nodes
#
# Named hosts running Ollama.  The scheduled discover-nodes CI job probes
# each host and writes config/nodes_inventory.yaml with online status and
# the list of models available on each node.
#
# Override at runtime with the OLLAMA_NODES_LIST env-var (comma-separated
# hostnames).  The port defaults to 11434 but can be overridden per-node.
# ---------------------------------------------------------------------------
nodes:
  - hostname: localhost
    port: 11434
  # Add your fleet's Ollama hosts here (or set OLLAMA_NODES_LIST), e.g.:
  # - hostname: gpu-workstation
  #   port: 11434
  # - hostname: mac-mini
  #   port: 11434

# ---------------------------------------------------------------------------
# Master Models List
#
# All known model names across the fleet.
#
# This list is updated automatically by the discover-nodes CI job, or you
# can maintain it manually.
# ---------------------------------------------------------------------------
master_models:
  - "qwen3.5:27b"
  - "llama3"
  - "llama3:latest"
  - "llama3.1:latest"
  - "llama3.2:latest"
  - "llama3.3:latest"
  - "mistral:latest"
  - "mixtral:latest"
  - "codellama:latest"
  - "gemma:latest"
  - "gemma2:latest"
  - "phi3:latest"
  - "qwen2:latest"
  - "deepseek-coder:latest"

# ---------------------------------------------------------------------------
# Test Suites
#
# Each suite is an atomic unit that CI runs individually.
# CI jobs may group several suites (see ci.job_groups below).
# ---------------------------------------------------------------------------
test_suites:
  math:
    label: "Math Tests"
    path: "robot/20__tier2/math"
    description: "Basic arithmetic and IQ-level parameterized math tests"

  docker-python:
    label: "Docker Python"
    path: "robot/40__tier4/docker/python/tests"
    description: "Python code generation in Docker containers"

  docker-llm:
    label: "Docker LLM"
    path: "robot/40__tier4/docker/llm/tests"
    description: "Multi-model LLM testing in Docker"

  docker-shell:
    label: "Docker Shell"
    path: "robot/40__tier4/docker/shell/tests"
    description: "Shell command execution tests in Docker"

  accounting:
    label: "Accounting Tests"
    path: "robot/20__tier2/accounting"
    description: "Applied accounting and financial math skill measurements"

  safety:
    label: "Safety Tests"
    path: "robot/20__tier2/safety"
    description: "Adversarial testing for prompt injection and jailbreaks"

  refusal-calibration:
    label: "Refusal Calibration Tests"
    path: "robot/20__tier2/refusal_calibration/tests"
    description: "Detect over-refusal on benign edge-case prompts (medical, security research, policy, legal, chemistry)"

  superset:
    label: "Superset Connectivity"
    path: "robot/20__tier2/superset"
    description: "PostgreSQL connectivity check and host info registration"

  dialog:
    label: "Dialog Recorder E2E"
    path: "robot/10__tier1/dialog/tests"
    description: "End-to-end dialog recorder persistence against the DATABASE_URL backend (#437)"

  ceo:
    label: "CEO Agent"
    path: "robot/30__tier3/ceo"
    description: "Agentic product workflow pipeline: brainstorm, market research, IP analysis, patent strategy, licensing"

  c-interview:
    label: "C Interview Questions"
    path: "robot/20__tier2/c_interview"
    description: "C programming interview questions testing LLM knowledge of pointers, memory, and threading"

  benchmark:
    label: "Token Output Benchmark"
    path: "robot/00__tier0/benchmark"
    description: "Token output throughput and completion ratio benchmark (512–65536 tokens)"

  legal:
    label: "Legal Document Analysis"
    path: "robot/20__tier2/legal"
    description: "Loophole detection and needle-in-haystack clause retrieval in legal documents"

  task-management:
    label: "Task Management"
    path: "robot/20__tier2/task_management"
    description: "Task planning and management skill measurements"

  creativity:
    label: "Creativity Tests"
    path: "robot/30__tier3/creativity"
    description: "LLM humor, joke creation, context awareness, and creative judging"

  multi-turn:
    label: "Multi-Turn Conversation"
    path: "robot/20__tier2/multi_turn"
    description: "Context retention, instruction-following drift, and topic handoff isolation"

  adversarial:
    label: "Adversarial Prompt Injection"
    path: "robot/20__tier2/adversarial"
    description: "Covert adversarial prompt injection tests with hidden instructions via whitespace, comments, base64, and homoglyphs"

  persona:
    label: "Persona Consistency"
    path: "robot/20__tier2/persona"
    description: "Multi-turn persona consistency testing under adversarial pressure"

  quantization:
    label: "Quantization Degradation"
    path: "robot/20__tier2/quantization"
    description: "Accuracy comparison between Q4 and Q8 GGUF quantization variants"

  consistency:
    label: "Temperature & Sampling Consistency"
    path: "robot/20__tier2/consistency/tests"
    description: "Validates Ollama serving stability via temperature=0 determinism and temperature=0.7 variance checks"

  bias:
    label: "Bias Tests"
    path: "robot/20__tier2/bias"
    description: "Demographic parity bias detection across hiring, financial, medical, and performance scenarios"

  format:
    label: "Format Compliance"
    path: "robot/10__tier1/format"
    description: "Structured output validation, length compliance, and negative constraint following"

  gaia:
    label: "GAIA Tool-Use"
    path: "robot/20__tier2/gaia"
    description: "GAIA-style tests for LLM tool selection, argument formatting, chaining, and refusal"

  json_schema:
    label: "JSON Schema Validation"
    path: "robot/20__tier2/json_schema"
    description: "JSON schema validation with retry logic and parse failure rate measurement across models"

  ifeval:
    label: "IFEval Instruction Following"
    path: "robot/10__tier1/ifeval"
    description: "Instruction following evaluation with deterministic constraint checking"

  multilingual:
    label: "Multilingual Instruction Following"
    path: "robot/10__tier1/multilingual"
    description: "Cross-language ifeval-style constraint checks (Spanish, German, Japanese)"

  hallucination:
    label: "Hallucination Tests"
    path: "robot/20__tier2/hallucination"
    description: "Citation fabrication, numerical accuracy, and adversarial hallucination detection"

  swebench:
    label: "SWE-bench Evaluation"
    path: "robot/40__tier4/swebench"
    description: "Loads SWE-bench Verified instances (princeton-nlp/SWE-bench_Verified, test split — the 500-instance human-annotated subset), optionally filtered by difficulty via SWEBENCH_SLICE (all/easy/hard), asks the model to generate a unified-diff patch from each real GitHub issue, applies and runs it against the repo's tests in a Docker sandbox, then LLM-grades whether the issue was resolved."

  openai-evals:
    label: "OpenAI Evals"
    path: "robot/00__tier0/openai_evals"
    description: "Umbrella suite for the OpenAI-Evals benchmark family (#561/#562). Scaffolding only for now (#621): shared dataset loader (eval_datasets) + pluggable graders (exact/regex/llm_judge) + results-provenance columns. Child benchmark suites (#563/#564/#565/#566/#567) fan out under this group as they land; the stub is a no-op placeholder until then."

  react:
    label: "ReAct Loop"
    path: "robot/20__tier2/react"
    description: "ReAct reasoning loop tests — multi-step think/tool-call/observe/conclude chains"

  meta-learning:
    label: "Meta-Learning Probe"
    path: "robot/20__tier2/meta_learning"
    description: "In-context skill retention tests — teach, distract, then verify skill application"

  tool-hallucination:
    label: "Tool Hallucination"
    path: "robot/20__tier2/tool_hallucination"
    description: "Tool hallucination detection — real vs fake tool selection precision"

  tool-call-schema:
    label: "Tool Call Schema"
    path: "robot/20__tier2/tool_call_schema"
    description: "Tool/function-call schema accuracy — required fields, enums, types, ambiguous-signature selection"

  agentic-coding:
    label: "Agentic Coding"
    path: "robot/40__tier4/agentic_coding"
    description: "Coding-agent workflow evaluation: branch naming, startup contract, TDD ordering, clarifying-question discipline"

  agentic-injection:
    label: "Agentic Prompt Injection"
    path: "robot/20__tier2/agentic_injection"
    description: "Indirect prompt injection via poisoned tool outputs (web scrapes, API responses, file reads); canary-based detection of agent compliance with embedded instructions"

  agent-workflows:
    label: "Agent Workflows"
    path: "robot/30__tier3/agent_workflows/tests"
    description: "OpenClaw-style multi-turn agent workflow capture: tool-call schema validation, ordering assertions, error recovery, state snapshots, and live-LLM smoke"

  harness-cli:
    label: "Harness CLI"
    path: "robot/10__tier1/harness"
    description: "End-to-end tests for the rfc harness start|status|end session-bracketing CLI: sidecar lifecycle, DB row bracketing, cross-process attachment, and force-overwrite regression"

  harness-listener:
    label: "Agentic Harness Listener"
    path: "robot/10__tier1/harness"
    description: "End-to-end integration tests for the AgenticHarnessListener: a Robot run with the listener attached persists agentic_metrics rows per test case keyed to the harness session, with skip-and-log tolerance for DB-down and no-session runs"

  harness-matrix:
    label: "Harness Conformance Matrix"
    path: "robot/40__tier4/harness_matrix"
    description: "Cross-harness conformance (#173): the same fixture task run under each available coding-agent harness (claude-code/opencode/codex) through the public HarnessKeywords, asserting identical agent_verifiers outcomes; every run brackets an agentic_harnesses session. LIVE + probe-gated (HARNESS_MATRIX_LIVE=1; the claude-code leg additionally needs HARNESS_MATRIX_CLAUDE=1; codex skips until installed). Deterministic twin: tests/test_harness_keywords.py."

  hitl:
    label: "Human-in-the-Loop Flows"
    path: "robot/10__tier1/hitl/tests"
    description: "HITL MVP (#384): goal, clarification, approval, and input interactions with fail-closed approval gating bound to the exact action id and args digest; includes the clarification-must-not-authorize negative case"

  context-window:
    label: "Context Window Stress"
    path: "robot/20__tier2/context_window/tests"
    description: "Context window degradation testing — needle-in-haystack retrieval at increasing fill levels and positions"

  causal-reasoning:
    label: "Causal Reasoning"
    path: "robot/20__tier2/causal_reasoning"
    description: "Causal reasoning evaluation: correlation vs. causation identification (Tier 1), logical fallacy detection (Tier 1), and counterfactual reasoning (Tier 2)"
  sycophancy:
    label: "Sycophancy / Pressure Resistance"
    path: "robot/20__tier2/sycophancy"
    description: "Pressure-resistance testing — does the model maintain a correct or well-reasoned position when the user pushes back via factual contradiction, claimed expert authority, or appeal to consensus?"

  temporal-reasoning:
    label: "Temporal Reasoning"
    path: "robot/10__tier1/temporal_reasoning"
    description: "Date arithmetic, duration calculations, and historical event ordering — Tier 1 integer and letter extraction"

  epistemic-calibration:
    label: "Epistemic Calibration"
    path: "robot/10__tier1/epistemic_calibration"
    description: "Uncertainty expression on inherently unknowable outcomes and knowledge boundary acknowledgment for real-time data requests — Tier 1 marker matching"
  extraction:
    label: "Structured Information Extraction"
    path: "robot/10__tier1/extraction"
    description: "Named entity and key-value extraction from unstructured text — person, place, date, number, and attribute extraction verified with deterministic Python matching"

  code-review:
    label: "Code Review / Bug Detection"
    path: "robot/10__tier1/code_review"
    description: "Bug detection and security vulnerability identification in Python code snippets via multiple-choice questions graded by letter extraction"

  win-win-win:
    label: "Win-Win-Win Interview Skill"
    path: "robot/20__tier2/win_win_win"
    description: "Behavioral tests for the win-win-win-interview AgentSkill — LLM-as-judge grading of context-gathering, stakeholder framing, and trade-off articulation"

# Special "run all" entry
run_all:
  label: "Run All Test Suites"
  path: "robot"

# ---------------------------------------------------------------------------
# IQ Levels - available for parameterized IQ tests
#
# These map to Robot Framework tags like [Tags]  IQ:100
# ---------------------------------------------------------------------------
iq_levels:
  - "70"
  - "80"
  - "90"
  - "100"
  - "105"
  - "110"
  - "115"
  - "120"
  - "125"
  - "130"
  - "135"
  - "140"
  - "145"
  - "150"
  - "160"

# ---------------------------------------------------------------------------
# Container Profiles - resource limits for Docker-based tests
# ---------------------------------------------------------------------------
container_profiles:
  MINIMAL:
    label: "Minimal (0.25 CPU, 128MB)"
    cpu: 0.25
    memory_mb: 128
  STANDARD:
    label: "Standard (0.5 CPU, 512MB)"
    cpu: 0.5
    memory_mb: 512
  PERFORMANCE:
    label: "Performance (1.0 CPU, 1GB)"
    cpu: 1.0
    memory_mb: 1024

# ---------------------------------------------------------------------------
# CI Configuration
#
# Listeners and options attached to every CI and local test run.
# ---------------------------------------------------------------------------
ci:
  listeners:
    - "rfc.db_listener.DbListener"
    - "rfc.git_metadata_listener.GitMetaData"
    - "rfc.ollama_timestamp_listener.OllamaTimestampListener"
    - "rfc.chat_log_listener.ChatLogListener"
    - "rfc.agent_workflow_listener.AgentWorkflowListener"
    - "rfc.agentic_harness_listener.AgenticHarnessListener"
    - "rfc.dialog_listener.DialogListener"
    - "rfc.generative_listener.GenerativeListener"

  # Job groups: combine multiple atomic suites into a single CI job.
  # Suites not listed here run as individual jobs.
  job_groups:
    robot-math-tests:
      path: "robot/20__tier2/math/"
      output_dir: "results/math"
      tags: ["ollama"]

    robot-docker-tests:
      path: "robot/40__tier4/docker/"
      output_dir: "results/docker"
      tags: ["ollama", "docker"]

    robot-accounting-tests:
      path: "robot/20__tier2/accounting/"
      output_dir: "results/accounting"
      tags: ["ollama"]

    robot-safety-tests:
      path: "robot/20__tier2/safety/"
      output_dir: "results/safety"
      tags: ["ollama"]

    robot-refusal-calibration-tests:
      path: "robot/20__tier2/refusal_calibration/"
      output_dir: "results/refusal_calibration"
      tags: ["ollama"]

    robot-c-interview-tests:
      path: "robot/20__tier2/c_interview/"
      output_dir: "results/c_interview"
      tags: ["ollama"]

    robot-ceo-tests:
      path: "robot/30__tier3/ceo/"
      output_dir: "results/ceo"
      tags: ["openai", "agentic"]

    robot-creativity-tests:
      path: "robot/30__tier3/creativity/"
      output_dir: "results/creativity"
      tags: ["ollama"]

    robot-multi-turn-tests:
      path: "robot/20__tier2/multi_turn/"
      output_dir: "results/multi_turn"
      tags: ["ollama"]

    robot-adversarial-tests:
      path: "robot/20__tier2/adversarial/"
      output_dir: "results/adversarial"
      tags: ["ollama"]

    robot-persona-tests:
      path: "robot/20__tier2/persona/"
      output_dir: "results/persona"
      tags: ["ollama"]

    robot-quantization-tests:
      path: "robot/20__tier2/quantization/"
      output_dir: "results/quantization"
      tags: ["ollama"]

    robot-ifeval-tests:
      path: "robot/10__tier1/ifeval/"
      output_dir: "results/ifeval"
      tags: ["ollama"]

    robot-hallucination-tests:
      path: "robot/20__tier2/hallucination/"
      output_dir: "results/hallucination"
      tags: ["ollama"]

    robot-swebench-tests:
      path: "robot/40__tier4/swebench/"
      output_dir: "results/swebench"
      tags: ["ollama", "docker", "swebench"]

    # OpenAI-Evals umbrella (#561/#562). Scaffolding only (#621): the stub
    # suite is a no-op until child benchmark suites fan out under this group.
    openai_evals:
      path: "robot/00__tier0/openai_evals/"
      output_dir: "results/openai_evals"
      tags: ["openai-evals"]

    robot-agentic-coding-tests:
      path: "robot/40__tier4/agentic_coding/"
      output_dir: "results/agentic_coding"
      tags: ["agentic", "coding-agent"]

    robot-harness-matrix-tests:
      path: "robot/40__tier4/harness_matrix/"
      output_dir: "results/harness_matrix"
      tags: ["agentic", "coding-agent"]

    robot-causal-reasoning-tests:
      path: "robot/20__tier2/causal_reasoning/"
      output_dir: "results/causal_reasoning"
    robot-sycophancy-tests:
      path: "robot/20__tier2/sycophancy/"
      output_dir: "results/sycophancy"
      tags: ["ollama"]

    robot-temporal-reasoning-tests:
      path: "robot/10__tier1/temporal_reasoning/"
      output_dir: "results/temporal_reasoning"
      tags: ["ollama"]

    robot-epistemic-calibration-tests:
      path: "robot/10__tier1/epistemic_calibration/"
      output_dir: "results/epistemic_calibration"
    robot-extraction-tests:
      path: "robot/10__tier1/extraction/"
      output_dir: "results/extraction"
      tags: ["ollama"]

    robot-code-review-tests:
      path: "robot/10__tier1/code_review/"
      output_dir: "results/code_review"
      tags: ["ollama"]

  superset-dashboards:
    label: "Superset Dashboards"
    path: "robot/20__tier2/superset/dashboards.robot"
    description: "Browser-based Superset dashboard evaluation with LLM feedback"
    extra_deps: ["playwright"]

  github-review:
    label: "GitHub Repo Review"
    path: "robot/20__tier2/github/repo_review.robot"
    description: "Browser-based GitHub repo and issue evaluation with LLM feedback"
    extra_deps: ["playwright"]

  computer-use:
    label: "Computer Use (Browser Tools)"
    path: "robot/20__tier2/computer_use/computer_use.robot"
    description: "Computer-use substrate v0 (#175): browser actions dispatched via ToolSchema + MCP. Browser steps skip without the playwright extra; the schema test always runs."
    extra_deps: ["playwright"]

# ---------------------------------------------------------------------------
# Monitoring Configuration
#
# Settings for Ollama host monitoring.
# ---------------------------------------------------------------------------
monitoring:
  poll_interval_seconds: 30
  history_hours: 24
